[project]
name = "animals"
version = "0.1.0"
description = "AI-powered animal species classifier built with PyTorch and Flask"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torchvision",
    "flask==3.0.0",
    "pillow==10.1.0",
    "numpy==1.26.2",
    "matplotlib==3.8.2",
    "scikit-learn==1.3.2",
    "tqdm==4.66.1",
    "werkzeug==3.0.1",
    "requests",
]

[project.scripts]
animals = "app:main"

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
